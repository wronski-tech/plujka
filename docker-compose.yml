services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: plujka-postgres
    environment:
      POSTGRES_DB: plujka
      POSTGRES_USER: plujka
      POSTGRES_PASSWORD: plujka
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plujka -d plujka"]
      interval: 5s
      timeout: 5s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: plujka-opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-PlujkaAdmin123!}
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: plujka-api
    environment:
      DATABASE_URL: postgresql://plujka:plujka@postgres:5432/plujka
      # Read-only role created by scripts/build_mart.py; used for LLM-generated SQL.
      MART_DATABASE_URL: postgresql://plujka_mart_reader:${MART_READER_PASSWORD:-plujka_mart_reader}@postgres:5432/plujka
      # production refuses to start with default passwords or without a rate limit.
      PLUJKA_ENV: ${PLUJKA_ENV:-development}
      ASK_RATE_LIMIT_PER_MINUTE: ${ASK_RATE_LIMIT_PER_MINUTE:-30}
      # Shared rate limit across workers/replicas, e.g. redis://redis:6379/0 with the "redis" profile.
      REDIS_URL: ${REDIS_URL:-}
      DAILY_TOKEN_LIMIT_PER_CLIENT: ${DAILY_TOKEN_LIMIT_PER_CLIENT:-0}
      # Comma-separated keys; when set, POST /ask and /feedback require the X-API-Key header.
      API_KEYS: ${API_KEYS:-}
      OPENSEARCH_URL: http://opensearch:9200
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIM: "128"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  streamlit:
    build:
      context: .
      dockerfile: docker/streamlit.Dockerfile
    container_name: plujka-streamlit
    environment:
      API_URL: http://api:8000
      PLUJKA_API_KEY: ${PLUJKA_API_KEY:-}
    ports:
      - "8501:8501"
    depends_on:
      - api

  loader:
    build:
      context: .
      dockerfile: docker/loader.Dockerfile
    container_name: plujka-loader
    environment:
      DATABASE_URL: postgresql://plujka:plujka@postgres:5432/plujka
      # The build sets the reader role's password from this URL.
      MART_DATABASE_URL: postgresql://plujka_mart_reader:${MART_READER_PASSWORD:-plujka_mart_reader}@postgres:5432/plujka
      OPENSEARCH_URL: http://opensearch:9200
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - >-
        python -u scripts/kbw_stage_duckdb.py --root /app/data/kbw_mirror/dane --out /app/data/kbw_stage_parquet &&
        for d in /app/data/pkw_all/sejmsenat*/zip; do python -u scripts/kbw_stage_duckdb.py --root "$$d" --out /app/data/pkw_stage_parquet; done &&
        python -u scripts/import_kbw_facts.py --root /app/data/kbw_mirror/dane --wait-db-seconds 600 &&
        python -u scripts/build_mart.py --parquet-root /app/data/kbw_stage_parquet --pkw-parquet-root /app/data/pkw_stage_parquet --wait-db-seconds 600
    profiles:
      - tools

  redis:
    image: redis:7-alpine
    container_name: plujka-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    profiles:
      - redis

  # Kibana-like UI for the question_logs index (status, latency, tokens, errors).
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.15.0
    container_name: plujka-opensearch-dashboards
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    profiles:
      - observability

volumes:
  postgres_data:
  opensearch_data:
