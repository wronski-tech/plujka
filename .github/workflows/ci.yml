# Unit tests (no DB), then integration against PostgreSQL 16 (pgvector): DB tests, a full mart
# build from the committed parquet files, and a check that every curated SQL example still runs.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            loader/requirements.txt

      - name: Install dependencies
        run: pip install -r api/requirements.txt -r loader/requirements.txt

      - name: Run unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test*.py' -v

  # Ruff (errors only, ruff.toml), mypy (mypy.ini, with a baseline of modules not yet clean) and
  # links between the repository's Markdown files (offline: external sites are not fetched).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            loader/requirements.txt

      - name: Install dependencies
        run: pip install -r api/requirements.txt -r loader/requirements.txt ruff==0.17.3 mypy==2.4.1

      - name: Ruff
        run: ruff check api scripts streamlit_app tests

      - name: Mypy
        run: mypy

      - name: Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments './**/*.md'
          fail: true

  integration:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: plujka
          POSTGRES_PASSWORD: plujka
          POSTGRES_DB: plujka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plujka -d plujka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://plujka:plujka@localhost:5432/plujka
      MART_DATABASE_URL: postgresql://plujka_mart_reader:plujka_mart_reader@localhost:5432/plujka
      PLUJKA_RUN_DB_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            loader/requirements.txt

      - name: Install dependencies
        run: pip install -r api/requirements.txt -r loader/requirements.txt

      - name: Run tests (including DB integration)
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test*.py' -v

      # Every consistency check in the builders must pass on PostgreSQL 16 with the committed data.
      # Families build in three processes (4 vCPU, 16 GB runner); persons and views follow serially.
      - name: Build the mart from committed parquet
        env:
          MART_DUCKDB_MEMORY_LIMIT: 3GB
        run: PYTHONPATH=. python -u scripts/build_mart.py --jobs 3

      - name: Check curated SQL examples against the built mart
        run: PYTHONPATH=. python scripts/add_sql_example.py --check

  # The images and docker-compose.yml as users run them: build, start, and answer one request.
  compose:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files and profiles
        run: |
          docker compose config -q
          docker compose --profile tools --profile redis --profile observability config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q

      - name: Build images
        run: docker compose --profile tools build

      - name: Start the stack
        run: docker compose up -d postgres opensearch api streamlit

      - name: Smoke test
        run: |
          for i in $(seq 1 60); do curl -fsS localhost:8000/health >/dev/null && break; sleep 5; done
          curl -fsS localhost:8000/health | jq -e '.status == "ok"'
          # No OpenAI key and no mart in this job: the request must still succeed (empty dynamic_sql answer).
          curl -fsS -X POST localhost:8000/ask -H 'Content-Type: application/json' \
            -d '{"question": "Frekwencja w referendum 2023"}' | jq -e '.intent == "dynamic_sql" and (.answer.text | length > 0)'
          for i in $(seq 1 30); do curl -fsS localhost:8501/_stcore/health && break; sleep 2; done

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -n 300

      - name: Stop the stack
        if: always()
        run: docker compose down -v
