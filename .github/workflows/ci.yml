# Unit tests (no DB) + optional integration against PostgreSQL (pgvector).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r api/requirements.txt

      - name: Run unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test*.py' -v

  integration:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: plujka
          POSTGRES_PASSWORD: plujka
          POSTGRES_DB: plujka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plujka -d plujka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://plujka:plujka@localhost:5432/plujka
      PLUJKA_RUN_DB_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r api/requirements.txt

      - name: Run tests (including DB integration)
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test*.py' -v
