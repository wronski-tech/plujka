# Type check in CI (lint job). Modules listed under the baseline still have type errors from before
# mypy was introduced; remove a module from the list once it passes. New modules are checked.
[mypy]
python_version = 3.11
ignore_missing_imports = True
files = api, streamlit_app

[mypy-api.services.db,api.services.dynamic_sql,api.services.kbw_import,api.services.mart.build_common,api.services.mart.build_gus,api.services.mart.build_pe,api.services.mart.build_precincts,api.services.mart.build_prezydent,api.services.mart.build_rady,api.services.mart.build_referendum,api.services.mart.build_samorzad,api.services.mart.build_sejm,api.services.mart.build_senat,api.services.mart.derived,api.services.mart.entities,api.services.mart.schema,api.services.router,api.services.seed,streamlit_app.app,app]
ignore_errors = True
